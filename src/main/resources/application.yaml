spring:
  application:
    name: razorpay

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  logging:
    level:
      org.hibernate.SQL: DEBUG
      org.hibernate.orm.jdbc.bind: TRACE

vault:
  master-key: WcYKlOH13XYzWvqPDNz9T96MisWn4BPqrnjTd6p/91U=

payment:
  simulator:
    poll-interval-ms: 5000
    chaos-mode: NORMAL
    methods:
      CARD:
        min-delay-seconds: 2
        max-delay-seconds: 6
        success-rate: 90
      UPI:
          min-delay-seconds: 1
          max-delay-seconds: 3
          success-rate: 95
      NETBANKING:
            min-delay-seconds: 4
            max-delay-seconds: 10
            success-rate: 80

